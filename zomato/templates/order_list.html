<!DOCTYPE html>
<html>
<head>
    <title>Food Orders</title>
    <style>
        table { border-collapse: collapse; width: 80%; margin: 20px auto; }
        th, td { border: 1px solid black; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Food Orders</h2>
    <table>
        <tr>
            <th>S. No.</th>
            <th>Customer Name</th>
            <th>Food Item</th>
            <th>Quantity</th>
            <th>Price (₹)</th>
            <th>Is Delivered</th>
        </tr>
        {% for o in orders %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ o.customer_name }}</td>
            <td>{{ o.food_item }}</td>
            <td>{{ o.quantity }}</td>
            <td>{{ o.price }}</td>
            <td>{{ o.is_delivered|yesno:"Yes,No" }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
